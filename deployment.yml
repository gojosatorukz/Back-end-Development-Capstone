apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
  labels:
    run: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - name: djangoserver
        image: us.icr.io/sn-labs-u242291/djangoserver:1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: PICTURES_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: band-services
              key: pictures-url
        - name: SONGS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: band-services
              key: songs-url
      restartPolicy: Always
